name: Build Android APK

on:
  push:
    branches: [ "indoor-fingerprint-apk-build-20260818" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Unpack Android project
        run: unzip -q android_project_src.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Copy APK to stable name
        run: cp app/build/outputs/apk/debug/app-debug.apk IndoorFingerprintCollector.apk
      - uses: actions/upload-artifact@v4
        with:
          name: IndoorFingerprintCollector-APK
          path: IndoorFingerprintCollector.apk
          if-no-files-found: error
