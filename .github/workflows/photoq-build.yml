name: Build PhotoQ APK
on:
  push:
    branches: [photoq-apk-build-20260823]
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: photoq-apk-build-20260823
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Decode and patch isolated source
        run: |
          cat photoq-tar.00 photoq-tar.01a photoq-tar.01b photoq-tar.01c photoq-tar.02 photoq-tar.03 > /tmp/photoq.tar.xz.b64
          base64 -d /tmp/photoq.tar.xz.b64 > /tmp/photoq.tar.xz
          mkdir -p photoq
          tar -xJf /tmp/photoq.tar.xz -C photoq
          python3 - <<'PY'
          from pathlib import Path
          p=Path('photoq/app/build.gradle')
          s=p.read_text()
          s=s.replace('compileSdk 36','compileSdk 35').replace('minSdk 36','minSdk 29').replace('targetSdk 36','targetSdk 35')
          needle='    buildFeatures { compose true }'
          repl="""    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { compose true }"""
          if needle in s and 'sourceCompatibility JavaVersion.VERSION_17' not in s:
              s=s.replace(needle,repl)
          p.write_text(s)
          PY
      - name: Run parser tests
        working-directory: photoq
        run: python3 -m unittest discover -s python_tests -v
      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          cd photoq
          gradle --no-daemon :app:assembleDebug --stacktrace 2>&1 | tee ../PhotoQ-build.log
      - name: Publish APK to isolated branch
        run: |
          cp photoq/app/build/outputs/apk/debug/app-debug.apk PhotoQ-debug.apk
          sha256sum PhotoQ-debug.apk > PhotoQ-debug.apk.sha256
          base64 -w0 PhotoQ-debug.apk > PhotoQ-debug.apk.b64
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PhotoQ-debug.apk.b64 PhotoQ-debug.apk.sha256 PhotoQ-build.log
          git commit -m 'Publish isolated PhotoQ debug APK'
          git push origin HEAD:photoq-apk-build-20260823
