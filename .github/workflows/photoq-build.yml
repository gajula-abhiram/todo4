name: Build PhotoQ APK
on:
  push:
    branches: [photoq-apk-build-20260823]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Decode source
        run: |
          cat photoq-tar.00 photoq-tar.01 photoq-tar.02 photoq-tar.03 > /tmp/photoq.tar.xz.b64
          base64 -d /tmp/photoq.tar.xz.b64 > /tmp/photoq.tar.xz
          mkdir -p photoq
          tar -xJf /tmp/photoq.tar.xz -C photoq
      - name: Run parser tests
        working-directory: photoq
        run: python3 -m unittest discover -s python_tests -v
      - name: Build debug APK
        id: assemble
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cd photoq
          gradle --no-daemon :app:assembleDebug --stacktrace 2>&1 | tee ../PhotoQ-build.log
      - name: Prepare APK checksum
        if: steps.assemble.outcome == 'success'
        run: |
          cp photoq/app/build/outputs/apk/debug/app-debug.apk PhotoQ-debug.apk
          sha256sum PhotoQ-debug.apk > PhotoQ-debug.apk.sha256
      - name: Upload build result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PhotoQ-build-result
          if-no-files-found: warn
          path: |
            PhotoQ-debug.apk
            PhotoQ-debug.apk.sha256
            PhotoQ-build.log
      - name: Fail if APK build failed
        if: steps.assemble.outcome == 'failure'
        run: exit 1
